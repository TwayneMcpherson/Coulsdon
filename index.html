
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coulsdon League Manager</title>

<style>
body{font-family:Segoe UI,sans-serif;background:#f5f5f5;margin:0;padding:16px}
h1{color:#cc1e2c;margin-bottom:10px}
.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{border:none;border-radius:6px;padding:6px 10px;font-weight:600;cursor:pointer}
.btn{background:#cc1e2c;color:#fff}
.btn-ghost{background:#fff;border:1px solid #cc1e2c;color:#cc1e2c}
.btn-admin{background:#990f19;color:#fff}
.hidden{display:none!important}
table{width:100%;border-collapse:collapse}
th{background:#cc1e2c;color:#fff}
th,td{padding:6px;border-bottom:1px solid #ddd;text-align:center}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:999}
.modal{background:#fff;padding:16px;border-radius:10px;width:90%;max-width:420px}
.close{float:right;cursor:pointer;color:#990f19;font-weight:700}
.adminOnly.hidden{display:none!important}
.adminBanner{color:#990f19;font-weight:bold;margin-top:6px}
</style>
</head>

<body>

<h1>Coulsdon League Manager</h1>

<!-- ADMIN -->
<div class="card">
  <button id="adminBtn" class="btn-admin">Enter Admin Mode</button>
  <div id="adminBanner" class="adminBanner hidden">ADMIN MODE ACTIVE</div>
</div>

<!-- CREATE / SELECT -->
<div class="card">
  <select id="leagueSelect"></select>
  <div class="row adminOnly hidden" style="margin-top:8px">
    <input id="leagueName" placeholder="League name">
    <select id="leagueSport">
      <option value="Pool">Pool</option>
      <option value="TableTennis">Table Tennis</option>
      <option value="FIFA">FIFA</option>
    </select>
    <button id="createLeague" class="btn">Create</button>
  </div>
</div>

<!-- JOIN -->
<div class="card">
  <h3>Join this league</h3>
  <div class="row">
    <input id="joinName" placeholder="Your name">
    <button id="joinBtn" class="btn">Request</button>
  </div>
  <div id="joinMsg"></div>
</div>

<!-- PLAYERS -->
<div class="card">
  <h3>Players</h3>
  <ul id="players"></ul>

  <div id="pendingPlayersWrap" class="adminOnly hidden">
    <h4>Pending Requests</h4>
    <table id="pendingPlayersTable">
      <thead><tr><th>Name</th><th>Action</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- FIXTURES -->
<div class="card">
  <h3>Fixtures</h3>
  <div class="row adminOnly hidden">
    <button id="genFix" class="btn">Generate</button>
    <button id="clrFix" class="btn-ghost">Clear</button>
  </div>
  <table id="fixturesTable">
    <thead><tr><th>Rnd</th><th>A</th><th>B</th><th>Submit</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<!-- TABLE -->
<div class="card">
  <h3>League Table</h3>
  <table>
    <thead>
      <tr><th>Pos</th><th>Player</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<!-- RESULTS -->
<div class="card">
  <h3>Results</h3>

  <div id="pendingResultsWrap" class="adminOnly hidden">
    <h4>Pending Results</h4>
    <table id="pendingResults">
      <thead><tr><th>Match</th><th>By</th><th>Action</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <table>
    <thead><tr><th>#</th><th>Details</th></tr></thead>
    <tbody id="resultsLog"></tbody>
  </table>
</div>

<!-- MODAL -->
<div id="modalBG" class="modal-bg hidden">
  <div class="modal">
    <span class="close" onclick="closeModal()">X</span>
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <button class="btn" style="width:100%" onclick="submitResult()">Submit</button>
  </div>
</div>

<script>
/* ===== STATE ===== */
const LS="CLM_FINAL";
let app=JSON.parse(localStorage.getItem(LS)||"{}");
if(!app.leagues) app={leagues:{},current:null};
let admin=false;
let activeFixture=null;

/* ===== UTIL ===== */
const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem(LS,JSON.stringify(app));
const cur=()=>app.leagues[app.current];
const sanitize=s=>(s||"").trim();

/* ===== ADMIN ===== */
$("adminBtn").onclick=()=>{
  if(!admin){
    if(prompt("Password")!=="StaffOnly-4429")return;
    admin=true;
  }else admin=false;
  $("adminBanner").classList.toggle("hidden",!admin);
  document.querySelectorAll(".adminOnly").forEach(e=>e.classList.toggle("hidden",!admin));
};

/* ===== LEAGUES ===== */
function renderLeagues(){
  const s=$("leagueSelect");
  s.innerHTML="";
  Object.values(app.leagues).forEach(l=>{
    let o=document.createElement("option");
    o.value=l.id;o.textContent=l.name+" ("+l.sport+")";
    s.appendChild(o);
  });
  s.value=app.current||"";
}
$("createLeague").onclick=()=>{
  const name=sanitize($("leagueName").value);
  if(!name)return;
  const id="L"+Math.random().toString(36).slice(2,7);
  app.leagues[id]={id,name,sport:$("leagueSport").value,players:[],pending:[],fixtures:[],results:[],pendingResults:[]};
  app.current=id;
  save(); render();
};
$("leagueSelect").onchange=e=>{app.current=e.target.value; render();};

/* ===== JOIN ===== */
$("joinBtn").onclick=()=>{
  const L=cur(); if(!L)return;
  const n=sanitize($("joinName").value);
  if(!n)return;
  if(L.players.includes(n)||L.pending.includes(n))return;
  L.pending.push(n);
  save(); render();
};

/* ===== FIXTURES ===== */
function genFixtures(){
  const L=cur(); if(!L||L.players.length<2)return;
  const p=[...L.players];
  if(p.length%2)p.push(null);
  let rounds=[];
  for(let r=0;r<p.length-1;r++){
    for(let i=0;i<p.length/2;i++){
      let a=p[i],b=p[p.length-1-i];
      if(a&&b)rounds.push({id:"F"+Math.random(),round:r+1,A:a,B:b});
    }
    p.splice(1,0,p.pop());
  }
  L.fixtures=rounds;
  L.results=[];
  save(); render();
}
$("genFix").onclick=genFixtures;
$("clrFix").onclick=()=>{cur().fixtures=[]; save(); render();};

/* ===== MODAL ===== */
function openModal(f){
  activeFixture=f;
  $("modalTitle").textContent=`${f.A} vs ${f.B}`;
  let html=`<label>You are:</label><select id="who">`;
  cur().players.forEach(p=>html+=`<option>${p}</option>`);
  html+=`</select><br><br>`;
  if(cur().sport==="Pool"){
    html+=`Winner<select id="w"><option>${f.A}</option><option>${f.B}</option></select>`;
  }else{
    html+=`${f.A}<input id="a" type="number"><br>${f.B}<input id="b" type="number">`;
  }
  $("modalBody").innerHTML=html;
  $("modalBG").classList.remove("hidden");
}
function closeModal(){$("modalBG").classList.add("hidden")}

/* ===== RESULT SUBMIT ===== */
function submitResult(){
  const L=cur(),f=activeFixture;
  let d={};
  if(L.sport==="Pool"){
    const w=$("w").value,l=w===f.A?f.B:f.A;
    d={winner:w,loser:l,mode:"normal"};
  }else{
    const a=+$("a").value,b=+$("b").value;
    if(isNaN(a)||isNaN(b))return;
    d=L.sport==="TableTennis"?{home:f.A,away:f.B,homePts:a,awayPts:b}:{A:f.A,B:f.B,goalsA:a,goalsB:b};
  }
  L.pendingResults.push({f,d,by:$("who").value});
  save(); render(); closeModal();
}

/* ===== APPROVE RESULT ===== */
function approveResult(i){
  const L=cur();
  const r=L.pendingResults[i];
  L.results.push(r);
  L.fixtures=L.fixtures.filter(x=>x!==r.f);
  L.pendingResults.splice(i,1);
  save(); render();
}

/* ===== RENDER ===== */
function render(){
  renderLeagues();
  const L=cur();
  $("players").innerHTML=L?L.players.map(p=>`<li>${p}</li>`).join(""):"";
  const pT=$("pendingPlayersTable").querySelector("tbody");
  pT.innerHTML="";
  if(L) L.pending.forEach(p=>{
    let tr=pT.insertRow();
    tr.innerHTML=`<td>${p}</td><td>
      <button class="btn" onclick="cur().players.push('${p}');cur().pending=cur().pending.filter(x=>x!=='${p}');save();render()">Approve</button>
    </td>`;
  });

  const fT=$("fixturesTable").querySelector("tbody");
  fT.innerHTML="";
  if(L) L.fixtures.forEach(f=>{
    let tr=fT.insertRow();
    tr.innerHTML=`<td>${f.round}</td><td>${f.A}</td><td>${f.B}</td>
      <td><button class="btn" onclick='openModal(${JSON.stringify(f)})'>Submit</button></td>`;
  });

  const prT=$("pendingResults").querySelector("tbody");
  prT.innerHTML="";
  if(L) L.pendingResults.forEach((r,i)=>{
    let tr=prT.insertRow();
    tr.innerHTML=`<td>${r.f.A} vs ${r.f.B}</td><td>${r.by}</td>
      <td><button class="btn" onclick="approveResult(${i})">Approve</button></td>`;
  });

  const log=$("resultsLog");
  log.innerHTML="";
  if(L) L.results.forEach((r,i)=>{
    log.innerHTML+=`<tr><td>${i+1}</td><td>${JSON.stringify(r.d)}</td></tr>`;
  });
}
render();
</script>

</body>
</html>
